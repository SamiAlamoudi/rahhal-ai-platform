name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

# Cancel stale runs on the same ref so PRs are not blocked by outdated builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (lockfile-faithful)
        run: npm ci

      - name: Secret / env hygiene scan
        run: bash scripts/secret-hygiene-scan.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Architecture circular dependency check
        run: npm run arch:circular

      - name: Test
        run: npm run test

      - name: Providers check
        run: npm run providers:check

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm run audit
        continue-on-error: false

  e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (lockfile-faithful)
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build E2E app (demo auth + mock providers)
        run: npm run build:e2e

      - name: Run Playwright booking funnel
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
